<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Controller icon -->
  <g transform="translate(400, 200)" fill="none" stroke="#673ab7" stroke-width="3" opacity="0.6">
    <!-- Controller body -->
    <ellipse cx="0" cy="0" rx="100" ry="50"/>
    <!-- Left handle -->
    <path d="M-80,30 Q-100,80 -80,100 Q-60,110 -50,80 Q-40,50 -50,30"/>
    <!-- Right handle -->
    <path d="M80,30 Q100,80 80,100 Q60,110 50,80 Q40,50 50,30"/>
    <!-- D-pad -->
    <rect x="-60" y="-15" width="30" height="10" rx="2"/>
    <rect x="-50" y="-25" width="10" height="30" rx="2"/>
    <!-- Buttons -->
    <circle cx="50" cy="-10" r="8"/>
    <circle cx="70" cy="5" r="8"/>
    <circle cx="30" cy="5" r="8"/>
    <circle cx="50" cy="20" r="8"/>
    <!-- Center buttons -->
    <circle cx="-15" cy="15" r="5"/>
    <circle cx="15" cy="15" r="5"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="330" fill="#fff" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" opacity="0.5">
    GameZone News
  </text>
</svg>
