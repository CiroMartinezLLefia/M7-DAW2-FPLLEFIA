<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#673ab7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarGrad)"/>
  
  <!-- User silhouette -->
  <g fill="#fff" opacity="0.9">
    <!-- Head -->
    <circle cx="100" cy="75" r="35"/>
    <!-- Body -->
    <ellipse cx="100" cy="175" rx="55" ry="50"/>
  </g>
  
  <!-- Controller overlay -->
  <g transform="translate(100, 135)" fill="none" stroke="#fff" stroke-width="2" opacity="0.3">
    <ellipse cx="0" cy="0" rx="30" ry="15"/>
    <rect x="-18" y="-5" width="10" height="3" rx="1"/>
    <circle cx="12" cy="-2" r="3"/>
    <circle cx="18" cy="3" r="3"/>
  </g>
</svg>
