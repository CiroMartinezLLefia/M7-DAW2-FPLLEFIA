<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#673ab7" />
      <stop offset="50%" style="stop-color:#00bcd4" />
      <stop offset="100%" style="stop-color:#673ab7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#heroGrad)"/>
  
  <!-- Grid pattern -->
  <g stroke="#673ab7" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>
  
  <!-- Decorative shapes -->
  <circle cx="150" cy="100" r="80" fill="none" stroke="#673ab7" stroke-width="2" opacity="0.2"/>
  <circle cx="1050" cy="500" r="60" fill="none" stroke="#00bcd4" stroke-width="2" opacity="0.2"/>
  
  <!-- Large controller icon -->
  <g transform="translate(600, 280)" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.4">
    <ellipse cx="0" cy="0" rx="150" ry="75"/>
    <path d="M-120,45 Q-150,120 -120,150 Q-90,165 -75,120 Q-60,75 -75,45"/>
    <path d="M120,45 Q150,120 120,150 Q90,165 75,120 Q60,75 75,45"/>
    <rect x="-90" y="-22" width="45" height="15" rx="3"/>
    <rect x="-75" y="-37" width="15" height="45" rx="3"/>
    <circle cx="75" cy="-15" r="12"/>
    <circle cx="105" cy="7" r="12"/>
    <circle cx="45" cy="7" r="12"/>
    <circle cx="75" cy="30" r="12"/>
  </g>
  
  <!-- GameZone text -->
  <text x="600" y="480" fill="#fff" font-family="Arial Black, sans-serif" font-size="48" text-anchor="middle" opacity="0.3">
    GAMEZONE
  </text>
  <text x="600" y="520" fill="#673ab7" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" opacity="0.5">
    Tu portal de noticias gaming
  </text>
</svg>
